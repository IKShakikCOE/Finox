openapi: 3.0.3
info:
  title: Finox Backend API
  description: >
    REST API contract for the Finox personal finance super-app (Bangladesh market).
    Derived from the Angular 21 frontend. See docs/BACKEND_SPEC.md for full context.
    Currency is BDT throughout. Dates are YYYY-MM-DD; datetimes are ISO-8601.
    All /api/** endpoints require a Keycloak-issued Bearer token unless marked otherwise.
  version: 1.0.0
  contact:
    name: Finox
servers:
  - url: /api
    description: Same-origin API (relative paths used by the frontend)
  - url: https://api.finox.app/api
    description: Production (configurable)

tags:
  - name: Auth
  - name: Tracker
  - name: Bank
  - name: Insurance
  - name: MutualFunds
  - name: Investment
  - name: News
  - name: Calendar
  - name: Messages
  - name: Advisor
  - name: User
  - name: Dashboard

security:
  - bearerAuth: []

paths:
  # ---------------- Auth ----------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (server-side Keycloak admin wrapper)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Trigger Keycloak password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Reset email sent }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- Tracker ----------------
  /tracker/meta:
    get:
      tags: [Tracker]
      summary: Tracker metadata (payment methods + category names)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerMeta' }

  /transactions:
    get:
      tags: [Tracker]
      summary: List transactions for current user
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [INCOME, EXPENSE] } }
        - { name: search, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
    post:
      tags: [Tracker]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Transaction' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
  /transactions/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    put:
      tags: [Tracker]
      summary: Update a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Transaction' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tracker]
      summary: Delete a transaction
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /transactions/bulk-delete:
    post:
      tags: [Tracker]
      summary: Bulk delete transactions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkDeleteRequest' }
      responses:
        '200': { description: Deleted }

  /categories:
    get:
      tags: [Tracker]
      summary: List categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
    post:
      tags: [Tracker]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Category' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
  /categories/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    put:
      tags: [Tracker]
      summary: Update category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Category' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tracker]
      summary: Delete category
      responses:
        '204': { description: Deleted }
  /categories/bulk-delete:
    post:
      tags: [Tracker]
      summary: Bulk delete categories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkDeleteRequest' }
      responses:
        '200': { description: Deleted }

  /accounts:
    get:
      tags: [Tracker]
      summary: List accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Account' } }
    post:
      tags: [Tracker]
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Account' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
  /accounts/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    put:
      tags: [Tracker]
      summary: Update account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Account' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tracker]
      summary: Delete account
      responses:
        '204': { description: Deleted }
  /accounts/bulk-delete:
    post:
      tags: [Tracker]
      summary: Bulk delete accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkDeleteRequest' }
      responses:
        '200': { description: Deleted }

  /budgets:
    get:
      tags: [Tracker]
      summary: List budgets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Budget' } }
    post:
      tags: [Tracker]
      summary: Create budget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Budget' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
  /budgets/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    put:
      tags: [Tracker]
      summary: Update budget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Budget' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tracker]
      summary: Delete budget
      responses:
        '204': { description: Deleted }

  # ---------------- Bank ----------------
  /banks:
    get:
      tags: [Bank]
      summary: List banks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Bank' } }
  /banks/products:
    get:
      tags: [Bank]
      summary: List bank products
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [SAVINGS, LOAN, FDR, DPS] } }
        - { name: bankId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BankProduct' } }
  /banks/profiles:
    get:
      tags: [Bank]
      summary: List bank profiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BankProfile' } }
  /banks/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    get:
      tags: [Bank]
      summary: Get a bank profile by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Insurance ----------------
  /insurance/companies:
    get:
      tags: [Insurance]
      summary: List insurance companies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InsuranceCompany' } }
  /insurance/products:
    get:
      tags: [Insurance]
      summary: List insurance products
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [LIFE, HEALTH, VEHICLE, PROPERTY, CHILD, PENSION] } }
        - { name: companyId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InsuranceProduct' } }
  /insurance/profiles:
    get:
      tags: [Insurance]
      summary: List insurance profiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InsuranceProfile' } }

  # ---------------- Mutual Funds ----------------
  /mutual-funds/amcs:
    get:
      tags: [MutualFunds]
      summary: List AMCs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AMC' } }
  /mutual-funds:
    get:
      tags: [MutualFunds]
      summary: List mutual funds
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [GROWTH, BALANCED, FIXED_INCOME] } }
        - { name: risk, in: query, schema: { type: string, enum: [LOW, MODERATE, HIGH] } }
        - { name: amcId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MutualFund' } }
  /mutual-funds/profiles:
    get:
      tags: [MutualFunds]
      summary: List AMC profiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AMCProfile' } }

  # ---------------- Investment ----------------
  /investment/platforms:
    get:
      tags: [Investment]
      summary: List investment/ad platforms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Platform' } }
  /investment/campaigns:
    get:
      tags: [Investment]
      summary: List campaigns for current user
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, PAUSED, COMPLETED] } }
        - { name: platformId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
    post:
      tags: [Investment]
      summary: Create campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Campaign' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
  /investment/campaigns/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    put:
      tags: [Investment]
      summary: Update campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Campaign' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Investment]
      summary: Delete campaign
      responses:
        '204': { description: Deleted }

  # ---------------- News ----------------
  /news:
    get:
      tags: [News]
      summary: List articles with categories
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsResponse' }
  /news/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    get:
      tags: [News]
      summary: Get a single article (with full body)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Calendar ----------------
  /calendar/events:
    get:
      tags: [Calendar]
      summary: List calendar events for current user
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
    post:
      tags: [Calendar]
      summary: Create calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarEvent' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
  /calendar/events/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    delete:
      tags: [Calendar]
      summary: Delete calendar event
      responses:
        '204': { description: Deleted }

  # ---------------- Messages ----------------
  /messages/conversations:
    get:
      tags: [Messages]
      summary: List conversations for current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
  /messages/contacts:
    get:
      tags: [Messages]
      summary: List chat contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ChatUser' } }
  /messages:
    get:
      tags: [Messages]
      summary: Messages between current user and a peer
      parameters:
        - { name: userId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Message' } }
    post:
      tags: [Messages]
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiverId, content]
              properties:
                receiverId: { type: string }
                content: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /messages/read:
    post:
      tags: [Messages]
      summary: Mark a conversation as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: OK }

  # ---------------- Advisor ----------------
  /advisor/chat:
    post:
      tags: [Advisor]
      summary: Send a message to the AI advisor (response content is Markdown)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvisorMessage' }
  /advisor/history:
    get:
      tags: [Advisor]
      summary: Advisor chat history for current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdvisorMessage' } }

  # ---------------- User ----------------
  /user/profile:
    get:
      tags: [User]
      summary: Get current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
    put:
      tags: [User]
      summary: Update profile (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfile' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
  /user/settings:
    get:
      tags: [User]
      summary: Get current user settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
    put:
      tags: [User]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }

  # ---------------- Dashboard ----------------
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Aggregated dashboard data for current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardData' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token (realm "finox", client "finox-app")

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, default: 25 }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    BulkDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string } }

    RegisterRequest:
      type: object
      required: [username, email, password, firstName, lastName]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        firstName: { type: string }
        lastName: { type: string }
    AuthUser:
      type: object
      properties:
        id: { type: string, description: Keycloak sub }
        username: { type: string }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }

    Transaction:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: number }
        type: { type: string, enum: [INCOME, EXPENSE] }
        category: { type: string }
        date: { type: string, format: date }
        paymentMethod: { type: string }
        accountId: { type: string }
        remarks: { type: string }
        isRecurring: { type: boolean }
        recurringFrequency: { type: string, enum: [MONTHLY, WEEKLY, YEARLY] }
    Category:
      type: object
      required: [name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [INCOME, EXPENSE] }
        icon: { type: string }
        color: { type: string }
        parentId: { type: string }
    Account:
      type: object
      required: [name, type, balance]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [CASH, BANK, CREDIT_CARD, MOBILE_BANKING] }
        balance: { type: number }
        currency: { type: string, default: BDT }
        icon: { type: string }
        color: { type: string }
    Budget:
      type: object
      required: [category, allocatedAmount, period]
      properties:
        id: { type: string }
        category: { type: string }
        allocatedAmount: { type: number }
        period: { type: string, enum: [MONTHLY, WEEKLY, YEARLY, CUSTOM] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        alertThreshold: { type: number, description: Percent threshold for alerts }
    TrackerMeta:
      type: object
      properties:
        paymentMethods: { type: array, items: { type: string } }
        incomeCategories: { type: array, items: { type: string } }
        expenseCategories: { type: array, items: { type: string } }

    Bank:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        logo: { type: string }
    BankProduct:
      type: object
      required: [id, bankId, bankName, category, name, interestRate]
      properties:
        id: { type: string }
        bankId: { type: string }
        bankName: { type: string }
        category: { type: string, enum: [SAVINGS, LOAN, FDR, DPS] }
        name: { type: string }
        interestRate: { type: number }
        minDeposit: { type: number, nullable: true }
        tenure: { type: string, nullable: true }
        features: { type: array, items: { type: string } }
        eligibility: { type: string }
    BankProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        established: { type: integer }
        authorizedCapital: { type: string }
        paidUpCapital: { type: string }
        totalAssets: { type: string }
        branches: { type: integer }
